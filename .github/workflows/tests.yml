name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el paquete
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -v

      - name: El demo tiene que correr sin datos externos
        run: python -m complex_trade_flow.demo

      - name: El dataset de ejemplo tiene que ser reproducible
        run: |
          python scripts/generate_sample_data.py
          git diff --exit-code -- complex_trade_flow/sample_data/ \
            || (echo "::error::El generador ya no reproduce el dataset versionado" && exit 1)

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construir e instalar la wheel
        run: |
          pip install build
          python -m build

      - name: La wheel tiene que traer los datos de ejemplo
        run: |
          pip install dist/*.whl
          cd /tmp && python -m complex_trade_flow.demo
